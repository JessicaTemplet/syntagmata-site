<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jessica Templet — Principal Software Engineer specializing in distributed systems, identity infrastructure, and applied mathematics.">
  <title>Jessica Templet — Principal Software Engineer</title>
  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --bg: #fafaf9;
      --bg-elevated: #ffffff;
      --bg-secondary: #f5f5f4;
      --text-primary: #1c1917;
      --text-secondary: #57534e;
      --text-muted: #a8a29e;
      --accent: #0c4a6e;
      --accent-light: #e0f2fe;
      --accent-hover: #075985;
      --border: #e7e5e4;
      --border-hover: #0c4a6e;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
      --radius: 16px;
      --radius-sm: 10px;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
      --max-width: 1200px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg: #0c0a09;
      --bg-elevated: #1c1917;
      --bg-secondary: #292524;
      --text-primary: #fafaf9;
      --text-secondary: #d6d3d1;
      --text-muted: #78716c;
      --accent: #38bdf8;
      --accent-light: #164e63;
      --accent-hover: #7dd3fc;
      --border: #292524;
      --border-hover: #38bdf8;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.4), 0 8px 10px -6px rgb(0 0 0 / 0.4);
      --shadow-xl: 0 25px 50px -12px rgb(0 0 0 / 0.5);
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.5s ease, color 0.5s ease;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    video {
      max-width: 100%;
      height: auto;
      display: block;
    }

    ::selection {
      background-color: var(--accent);
      color: white;
    }

    /* ============================================================
       UTILITIES
       ============================================================ */
    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    @media (min-width: 768px) {
      .container {
        padding: 0 2rem;
      }
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1rem 0;
      transition: var(--transition);
      border-bottom: 1px solid transparent;
    }

    .navbar.scrolled {
      background-color: rgba(var(--bg-rgb, 250, 250, 249), 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-color: var(--border);
      padding: 0.75rem 0;
    }

    [data-theme="dark"] .navbar.scrolled {
      background-color: rgba(12, 10, 9, 0.85);
    }

    .navbar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: none;
      align-items: center;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .nav-links {
        display: flex;
      }
    }

    .nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      position: relative;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background-color: var(--accent);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    .nav-links a.active {
      color: var(--text-primary);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .mobile-menu-btn {
      display: flex;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      padding: 0.5rem;
    }

    @media (min-width: 768px) {
      .mobile-menu-btn {
        display: none;
      }
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      background-color: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem;
      z-index: 999;
      flex-direction: column;
      gap: 1rem;
    }

    .mobile-menu.open {
      display: flex;
    }

    .mobile-menu a {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .mobile-menu a:last-child {
      border-bottom: none;
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* ============================================================
       HERO SECTION
       ============================================================ */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 6rem 0 4rem;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, var(--accent-light) 0%, transparent 70%);
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    [data-theme="dark"] .hero::before {
      opacity: 0.15;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .hero-grid {
        grid-template-columns: 1.1fr 0.9fr;
        gap: 4rem;
      }
    }

    .hero-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      background-color: var(--accent-light);
      padding: 0.375rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
    }

    .hero-greeting {
      font-size: clamp(1.125rem, 2vw, 1.5rem);
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.1s forwards;
    }

    .hero-headline {
      font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.2s forwards;
    }

    .hero-body {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.3s forwards;
    }

    .hero-body p {
      font-size: 1.0625rem;
      line-height: 1.75;
      color: var(--text-secondary);
      max-width: 540px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.4s forwards;
    }

    .hero-image {
      position: relative;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.5s forwards;
    }

    .hero-image img {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow-xl);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s ease;
    }

    .hero-image:hover img {
      transform: scale(1.02) translateY(-4px);
    }

    .hero-image::before {
      content: '';
      position: absolute;
      inset: -12px;
      border: 2px solid var(--accent);
      border-radius: calc(var(--radius) + 12px);
      opacity: 0.15;
      z-index: -1;
      transition: opacity 0.3s ease;
    }

    .hero-image:hover::before {
      opacity: 0.3;
    }

    /* ============================================================
       SECTIONS
       ============================================================ */
    .section-header {
      margin-bottom: 3rem;
    }

    .section-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    /* ============================================================
       PROJECTS
       ============================================================ */
    .projects {
      padding: 5rem 0 6rem;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .projects-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .project-card {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      transition: var(--transition-slow);
      position: relative;
      overflow: hidden;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 0;
      background-color: var(--accent);
      transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-hover);
    }

    .project-card:hover::before {
      height: 100%;
    }

    .project-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .project-index {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.375rem;
      flex-shrink: 0;
      margin-top: 0.25rem;
      transition: color 0.3s ease;
    }

    .project-card:hover .project-index {
      color: var(--accent);
    }

    .project-index .dot {
      width: 6px;
      height: 6px;
      background-color: currentColor;
      border-radius: 50%;
      display: inline-block;
    }

    .project-meta {
      flex: 1;
      min-width: 0;
    }

    .project-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .project-title a {
      color: var(--text-primary);
      transition: color 0.2s ease;
      position: relative;
    }

    .project-title a:hover {
      color: var(--accent);
    }

    .project-title a[target="_blank"]::after {
      content: '↗';
      font-size: 0.75em;
      margin-left: 0.25rem;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }

    .project-title a[target="_blank"]:hover::after {
      opacity: 1;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.625rem;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .status-live {
      background-color: var(--success-light, #d1fae5);
      color: var(--success, #059669);
    }

    [data-theme="dark"] .status-live {
      background-color: #064e3b;
      color: #34d399;
    }

    .status-desktop {
      background-color: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .status-building {
      background-color: var(--warning-light, #fef3c7);
      color: var(--warning, #b45309);
    }

    [data-theme="dark"] .status-building {
      background-color: #451a03;
      color: #fbbf24;
    }

    .status-source {
      background-color: var(--info-light, #e0e7ff);
      color: var(--info, #4338ca);
    }

    [data-theme="dark"] .status-source {
      background-color: #1e1b4b;
      color: #818cf8;
    }

    .project-desc {
      font-size: 0.9375rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 1.25rem;
    }

    .project-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .stack-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.25rem 0.625rem;
      background-color: var(--bg-secondary);
      color: var(--text-secondary);
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .project-card:hover .stack-tag {
      border-color: var(--accent);
      color: var(--accent);
    }

    .project-video {
      margin: 0 -2rem -2rem;
      padding: 0;
      overflow: hidden;
      border-top: 1px solid var(--border);
    }

    .project-video video {
      width: 100%;
      display: block;
      cursor: pointer;
    }

    /* ============================================================
       CONTACT / FOOTER
       ============================================================ */
    .contact {
      padding: 5rem 0;
      border-top: 1px solid var(--border);
      background-color: var(--bg-secondary);
      transition: background-color 0.5s ease;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: center;
    }

    @media (min-width: 768px) {
      .contact-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .contact-text h2 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .contact-text p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      max-width: 400px;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1.25rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .contact-link:hover {
      border-color: var(--accent);
      transform: translateX(4px);
      color: var(--accent);
    }

    .contact-link svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .contact-link:hover svg {
      color: var(--accent);
    }

    .footer {
      padding: 2rem 0;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* ============================================================
       RESUME PAGE
       ============================================================ */
    .resume-page {
      padding: 7rem 0 4rem;
      min-height: 100vh;
    }

    .resume-actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .resume-paper {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-lg);
    }

    @media (min-width: 768px) {
      .resume-paper {
        padding: 4rem 3.5rem;
      }
    }

    .resume-header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 2px solid var(--accent);
    }

    .resume-header h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .resume-title {
      font-size: 1.0625rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .resume-contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .resume-contact a {
      color: var(--accent);
      transition: color 0.2s ease;
    }

    .resume-contact a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .resume-section {
      margin-bottom: 2.5rem;
    }

    .resume-section:last-child {
      margin-bottom: 0;
    }

    .resume-section h2 {
      font-size: 1.125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .resume-section ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .resume-section ul li {
      position: relative;
      padding-left: 1.25rem;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .resume-section ul li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 600;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .skills-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .skill-category h3 {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .skill-category p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .job {
      margin-bottom: 2rem;
    }

    .job:last-child {
      margin-bottom: 0;
    }

    .job-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.25rem 1rem;
      margin-bottom: 0.75rem;
    }

    .job-title {
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .job-meta {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .job-company {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .job ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .job ul li {
      position: relative;
      padding-left: 1.25rem;
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .job ul li::before {
      content: '•';

            observer.unobserve(entry.target);
